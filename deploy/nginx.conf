# reflog behind nginx. Refer to docs/07-hosting.md.
# Copy to /etc/nginx/sites-available/reflog (Linux) or $(brew --prefix)/etc/nginx/servers/reflog.conf (macOS).
# Change the LAN ranges below if your network uses other ones.

server {
    listen 80;
    server_name app.reflog.day;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.reflog.day;

    ssl_certificate     /etc/letsencrypt/live/app.reflog.day/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.reflog.day/privkey.pem;

    # LAN and Tailscale only.
    allow 192.168.0.0/16;
    allow 10.0.0.0/8;
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    deny  all;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /sw.js {
        proxy_pass http://127.0.0.1:8740;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8740;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;   # JSON import
    }
}
